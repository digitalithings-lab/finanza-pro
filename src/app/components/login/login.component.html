<div class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-slate-950 px-4 relative transition-colors duration-200">
  <div class="fixed top-5 right-5 z-20">
    <app-theme-toggle></app-theme-toggle>
  </div>

  <div class="max-w-md w-full space-y-8 bg-white dark:bg-slate-900 p-10 rounded-2xl shadow-xl dark:shadow-2xl dark:shadow-black/40 border border-gray-100 dark:border-slate-800 fade-in transition-colors duration-200">
    <div class="text-center">
      <img src="/assets/logo-icon.svg" alt="NOX" class="mx-auto h-16 w-16 mb-4">
      <h2 class="text-3xl font-bold text-navy-800 dark:text-slate-100 tracking-tight">NOX</h2>
      <p class="mt-2 text-sm text-gray-500 dark:text-slate-400">Sistema de gestión contable</p>
    </div>

    <form class="mt-8 space-y-6" (submit)="onLogin()">
      <div class="space-y-4">
        <div class="relative">
          <label class="text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider mb-1 block">Usuario</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <lucide-icon [img]="User" class="h-4 w-4 text-gray-400 dark:text-slate-500"></lucide-icon>
            </div>
            <input 
              [(ngModel)]="username" 
              name="username" 
              type="text" 
              required 
              class="block w-full pl-10 pr-3 py-3 border border-gray-200 dark:border-slate-700 rounded-xl leading-5 bg-white dark:bg-slate-800 text-navy-800 dark:text-slate-100 placeholder-gray-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all duration-200 sm:text-sm"
              placeholder="admin"
            >
          </div>
        </div>

        <div class="relative">
          <label class="text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider mb-1 block">Contraseña</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <lucide-icon [img]="Lock" class="h-4 w-4 text-gray-400 dark:text-slate-500"></lucide-icon>
            </div>
            <input 
              [(ngModel)]="password" 
              name="password" 
              [type]="showPassword ? 'text' : 'password'"
              required 
              class="block w-full pl-10 pr-10 py-3 border border-gray-200 dark:border-slate-700 rounded-xl leading-5 bg-white dark:bg-slate-800 text-navy-800 dark:text-slate-100 placeholder-gray-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all duration-200 sm:text-sm"
              placeholder="••••••••"
            >
            <button
              type="button"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Ver contraseña'"
              [attr.aria-pressed]="showPassword"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 dark:text-slate-400 hover:text-navy-800 dark:hover:text-slate-200 focus:outline-none transition-colors duration-200"
            >
              <lucide-icon [img]="showPassword ? EyeOff : Eye" class="h-4 w-4"></lucide-icon>
            </button>
          </div>
        </div>
      </div>

      <div *ngIf="error" class="text-red-500 dark:text-red-400 text-xs text-center font-medium animate-pulse">
        {{ error }}
      </div>

      <div>
        <button 
          type="submit" 
          [disabled]="isLoading"
          [attr.aria-busy]="isLoading"
          [attr.aria-label]="isLoading ? 'Iniciando sesión' : null"
          class="group relative w-full flex items-center justify-center py-3 px-4 border border-transparent text-sm font-semibold rounded-xl text-white bg-navy-800 hover:bg-navy-800/85 dark:bg-brand-600 dark:hover:bg-brand-600/85 focus:outline-none focus:ring-2 focus:ring-offset-2 dark:focus:ring-offset-slate-900 focus:ring-brand-500 transition-all duration-200 shadow-lg hover:shadow-xl active:scale-[0.98] disabled:opacity-90 disabled:cursor-wait disabled:hover:bg-navy-800 dark:disabled:hover:bg-brand-600 disabled:hover:shadow-lg disabled:active:scale-100"
        >
          <span *ngIf="!isLoading">Iniciar Sesión</span>
          <span *ngIf="isLoading" class="relative flex h-5 w-5 items-center justify-center" aria-hidden="true">
            <span class="absolute inset-0 rounded-full border-2 border-white/25"></span>
            <span class="h-5 w-5 rounded-full border-2 border-transparent border-t-white border-r-white/75 animate-spin"></span>
          </span>
        </button>
      </div>
    </form>

    <div class="text-center mt-6">
      <p class="text-xs text-gray-400 dark:text-slate-500 italic">Demo: admin / admin</p>
    </div>
  </div>
</div>
