<div
  class="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-navy-900/80 dark:bg-black/85 backdrop-blur-md"
  role="dialog"
  aria-modal="true"
  aria-labelledby="force-password-title"
>
  <div class="bg-white dark:bg-slate-900 border border-gray-100 dark:border-slate-800 w-full max-w-md rounded-3xl shadow-2xl overflow-hidden fade-in">
    <!-- Header -->
    <div class="px-8 py-6 border-b border-gray-100 dark:border-slate-800 bg-gray-50/60 dark:bg-slate-800/50 flex items-center gap-4">
      <div class="h-11 w-11 rounded-2xl bg-navy-800/10 dark:bg-darkbtn/25 text-navy-800 dark:text-slate-100 flex items-center justify-center shrink-0">
        <lucide-icon [img]="ShieldCheck" class="w-6 h-6"></lucide-icon>
      </div>
      <div>
        <h2 id="force-password-title" class="text-xl font-bold text-navy-800 dark:text-slate-100">
          Actualiza tu contraseña
        </h2>
        <p class="text-xs text-gray-500 dark:text-slate-400 mt-0.5">
          Debes cambiar la contraseña temporal asignada antes de continuar.
        </p>
      </div>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="p-8 space-y-5">
      <div
        *ngIf="error"
        role="alert"
        class="px-4 py-3 rounded-xl border border-red-200 dark:border-red-500/30 bg-red-50 dark:bg-red-500/10 text-xs font-semibold text-red-600 dark:text-red-400"
      >
        {{ error }}
      </div>

      <!-- 1. Contraseña anterior -->
      <div>
        <label for="current-password" class="text-xs font-semibold text-gray-600 dark:text-slate-300 block mb-1.5">
          1. Contraseña anterior
        </label>
        <div class="relative">
          <input
            id="current-password"
            name="currentPassword"
            [(ngModel)]="currentPassword"
            [type]="showCurrent ? 'text' : 'password'"
            autocomplete="current-password"
            required
            placeholder="Ingresa la contraseña asignada"
            class="w-full pl-4 pr-10 py-3 bg-gray-50 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-xl text-sm text-navy-800 dark:text-slate-100 placeholder-gray-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all"
          >
          <button
            type="button"
            (click)="showCurrent = !showCurrent"
            [attr.aria-label]="showCurrent ? 'Ocultar contraseña anterior' : 'Ver contraseña anterior'"
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 dark:text-slate-400 hover:text-navy-800 dark:hover:text-slate-200 transition-colors"
          >
            <lucide-icon [img]="showCurrent ? EyeOff : Eye" class="w-4 h-4"></lucide-icon>
          </button>
        </div>
      </div>

      <!-- 2. Contraseña nueva -->
      <div>
        <label for="new-password" class="text-xs font-semibold text-gray-600 dark:text-slate-300 block mb-1.5">
          2. Contraseña nueva
        </label>
        <div class="relative">
          <input
            id="new-password"
            name="newPassword"
            [(ngModel)]="newPassword"
            [type]="showNew ? 'text' : 'password'"
            autocomplete="new-password"
            required
            placeholder="Crea tu nueva contraseña"
            class="w-full pl-4 pr-10 py-3 bg-gray-50 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-xl text-sm text-navy-800 dark:text-slate-100 placeholder-gray-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all"
          >
          <button
            type="button"
            (click)="showNew = !showNew"
            [attr.aria-label]="showNew ? 'Ocultar contraseña nueva' : 'Ver contraseña nueva'"
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 dark:text-slate-400 hover:text-navy-800 dark:hover:text-slate-200 transition-colors"
          >
            <lucide-icon [img]="showNew ? EyeOff : Eye" class="w-4 h-4"></lucide-icon>
          </button>
        </div>

        <!-- Strength bar -->
        <div class="grid grid-cols-4 gap-1.5 mt-2.5" aria-hidden="true">
          <div
            *ngFor="let step of [1, 2, 3, 4]"
            class="h-1.5 rounded-full transition-colors duration-200"
            [ngClass]="passedRulesCount >= step
              ? (passedRulesCount === 4 ? 'bg-emerald-500' : passedRulesCount >= 2 ? 'bg-amber-400' : 'bg-red-400')
              : 'bg-gray-200 dark:bg-slate-700'"
          ></div>
        </div>

        <!-- Live requirements checklist -->
        <ul class="mt-3 space-y-1.5" aria-label="Requisitos de la contraseña">
          <li
            *ngFor="let rule of rules"
            class="flex items-center gap-2 text-xs transition-colors"
            [ngClass]="rule.passed ? 'text-emerald-600 dark:text-emerald-400 font-medium' : 'text-gray-400 dark:text-slate-400'"
          >
            <lucide-icon [img]="rule.passed ? Check : Circle" class="w-3.5 h-3.5 shrink-0"></lucide-icon>
            <span>{{ rule.label }}</span>
          </li>
          <li
            *ngIf="newPassword && currentPassword && !isDifferentFromCurrent"
            class="text-xs font-medium text-red-500 dark:text-red-400 pt-0.5"
          >
            Debe ser diferente a la contraseña anterior.
          </li>
        </ul>
      </div>

      <!-- 3. Confirmar -->
      <div>
        <label for="confirm-password" class="text-xs font-semibold text-gray-600 dark:text-slate-300 block mb-1.5">
          3. Confirmar
        </label>
        <div class="relative">
          <input
            id="confirm-password"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            [type]="showConfirm ? 'text' : 'password'"
            autocomplete="new-password"
            required
            placeholder="Repite tu nueva contraseña"
            class="w-full pl-4 pr-10 py-3 bg-gray-50 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-xl text-sm text-navy-800 dark:text-slate-100 placeholder-gray-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all"
          >
          <button
            type="button"
            (click)="showConfirm = !showConfirm"
            [attr.aria-label]="showConfirm ? 'Ocultar confirmación' : 'Ver confirmación'"
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 dark:text-slate-400 hover:text-navy-800 dark:hover:text-slate-200 transition-colors"
          >
            <lucide-icon [img]="showConfirm ? EyeOff : Eye" class="w-4 h-4"></lucide-icon>
          </button>
        </div>
        <p
          *ngIf="confirmPassword.length > 0"
          class="text-xs font-medium mt-1.5"
          [ngClass]="passwordsMatch ? 'text-emerald-600 dark:text-emerald-400' : 'text-red-500 dark:text-red-400'"
        >
          {{ passwordsMatch ? 'Las contraseñas coinciden.' : 'Las contraseñas no coinciden.' }}
        </p>
      </div>

      <button
        type="submit"
        [disabled]="!canSubmit"
        class="w-full py-3 px-4 bg-navy-800 hover:bg-navy-900 dark:bg-darkbtn dark:hover:bg-darkbtn-hover text-white rounded-xl text-sm font-bold transition-all shadow-lg active:scale-[0.98] disabled:opacity-40 disabled:cursor-not-allowed disabled:active:scale-100 flex items-center justify-center gap-2"
      >
        <lucide-icon *ngIf="isSaving" [img]="Loader2" class="w-4 h-4 animate-spin"></lucide-icon>
        <span>{{ isSaving ? 'Guardando...' : 'Guardar nueva contraseña' }}</span>
      </button>

      <div class="text-center pt-1">
        <button
          type="button"
          (click)="logoutRequested.emit()"
          [disabled]="isSaving"
          class="inline-flex items-center gap-1.5 text-xs font-medium text-gray-400 dark:text-slate-400 hover:text-red-500 dark:hover:text-red-400 transition-colors disabled:opacity-40"
        >
          <lucide-icon [img]="LogOut" class="w-3.5 h-3.5"></lucide-icon>
          Cerrar sesión
        </button>
      </div>
    </form>
  </div>
</div>
